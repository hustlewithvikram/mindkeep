name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true
        default: '0.1.0'
        type: string
      tag:
        description: Optional Git tag (defaults to v<version>)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mindkeep-upload.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mindkeep-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          gradle --no-daemon :app:assembleRelease -PversionName="$RELEASE_VERSION" -PversionCode="$VERSION_CODE"

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="v$RELEASE_VERSION"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          {
            echo "## MindKeep $RELEASE_VERSION"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Triggered by: $GITHUB_ACTOR"
            echo "- Built at (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "### Changelog (latest 30 commits)"
            git log -30 --pretty=format:'- %h %s — %an'
            echo
            echo
            echo "### Build details"
            echo "- Variant: release"
            echo "- Package: com.vikram.mindkeep"
            echo "- Signed with the MindKeep CI signing key."
          } > release-notes.md

      - name: Calculate APK checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk app-release.apk.sha256 --repo "$GITHUB_REPOSITORY" --title "MindKeep ${{ inputs.version }}" --notes-file release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindkeep-release-${{ inputs.version }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
          retention-days: 90
