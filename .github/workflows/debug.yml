name: Debug APK

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build-debug:
    name: Build and publish signed debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mindkeep-upload.jks"
          test -s "$RUNNER_TEMP/mindkeep-upload.jks" || (echo "::error::Decoded keystore is empty or invalid" && exit 1)

      - name: Build signed debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mindkeep-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release notes
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "## MindKeep Debug build"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Triggered by: $GITHUB_ACTOR"
            echo "- Built at (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "### Changelog (latest 20 commits)"
            git log -20 --pretty=format:'- %h %s — %an'
            echo
            echo
            echo "### Build details"
            echo "- Variant: debug"
            echo "- Package: com.vikram.mindkeep"
            echo "- Signed with the MindKeep CI signing key."
          } > release-notes.md
          echo "DEBUG_TAG=debug-$SHORT_SHA-$GITHUB_RUN_NUMBER-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Verify APK and calculate checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Publish debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$DEBUG_TAG" app/build/outputs/apk/debug/app-debug.apk app-debug.apk.sha256 --repo "$GITHUB_REPOSITORY" --title "MindKeep Debug $GITHUB_RUN_NUMBER ($SHORT_SHA)" --prerelease --notes-file release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindkeep-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          retention-days: 30
